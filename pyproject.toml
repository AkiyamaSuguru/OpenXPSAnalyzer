[project]
name = "openxpsanalyzer"
version = "0.4.0"
description = "Open-source cross-platform Flet application for Avantage XPS data post-processing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Jay Mamun" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "flet[all]==0.82.2",
    "flet-charts==0.82.2",
    "h5netcdf>=1.4.1",
    "h5py>=3.12.1",
    "matplotlib>=3.9.2",
    "numpy>=2.1.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "scienceplots>=2.1.1",
    "xlrd>=2.0.1",
    "xarray>=2024.10.0",
]

[project.urls]
Homepage = "https://github.com/AkiyamaSuguru/OpenXPSAnalyzer"
Repository = "https://github.com/AkiyamaSuguru/OpenXPSAnalyzer"
Issues = "https://github.com/AkiyamaSuguru/OpenXPSAnalyzer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xps_app"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.1",
]

[tool.flet]
org = "io.github.akiyamasuguru"
product = "OpenXPSAnalyzer"
company = "OpenXPSAnalyzer contributors"
copyright = "Copyright (C) 2026 Jay Mamun and OpenXPSAnalyzer contributors. AGPL-3.0-or-later."

[tool.flet.app]
path = "src"
module = "main.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
