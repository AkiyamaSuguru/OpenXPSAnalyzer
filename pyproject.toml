[project]
name = "xps-analyzer"
version = "0.3.0"
description = "Cross-platform Flet application for Avantage XPS data analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Jay Mamun" }]
license = { file = "LICENSE" }
dependencies = [
    "flet[all]==0.82.2",
    "flet-charts==0.82.2",
    "h5netcdf>=1.4.1",
    "h5py>=3.12.1",
    "matplotlib>=3.9.2",
    "numpy>=2.1.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "scienceplots>=2.1.1",
    "xlrd>=2.0.1",
    "xarray>=2024.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xps_app"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.1",
]

[tool.flet]
org = "com.xpsanalyzer"
product = "XPS Analyzer"
company = "Jay Mamun"
copyright = "Copyright (C) 2026 Jay Mamun. All rights reserved."

[tool.flet.app]
path = "src"
module = "main.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
